<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141922"><title>JnJ Premium Shift Calendar</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#111720;color:#f4f5f8;--panel:#1b2430;--line:#354151;--muted:#9eabb9;--gold:#d7b65e;--green:#4f9c7a;--blue:#80a8ca;--accent:#bb6578}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#2b3445 0%,#111720 52%)}button,textarea{font:inherit}button{cursor:pointer}header{background:#171f2b;border-bottom:1px solid #344050;padding:25px 18px 22px}header .inner,main{max-width:850px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#d8a3b0;font-weight:750}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h1{font-size:clamp(25px,5vw,35px);letter-spacing:-.8px;margin:7px 0}.subtitle{font-size:13px;color:#aeb9c7;margin:0}.mark{border:1px solid #9b5061;color:#e8bcc6;border-radius:12px;padding:11px;font-size:12px;letter-spacing:1px;font-weight:800}main{padding:18px 13px 32px}.panel{background:#1b2430;border:1px solid #344052;border-radius:17px;padding:17px;margin-bottom:15px;box-shadow:0 10px 30px #050a1230}.label{font-size:11px;letter-spacing:1.7px;color:#a8b5c5;font-weight:750;text-transform:uppercase;margin-bottom:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tab{border:1px solid #3d4a5b;background:#242e3c;color:#cbd3df;padding:13px 5px;border-radius:11px;font-weight:750}.tab.active{background:#74404e;border-color:#d18b9c;color:white;box-shadow:inset 0 0 0 1px #b66b80}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.monthbar h2{font-size:21px;letter-spacing:-.4px;margin:0;text-align:center}.nav{background:#263140;border:1px solid #445166;color:#e8edf3;border-radius:10px;width:43px;height:41px;font-size:25px}.todaybtn{display:block;margin:10px auto 0;background:none;color:#c5a2ad;border:0;font-size:12px;text-decoration:underline}.legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin:20px 0 15px;color:#c3ceda;font-size:11px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{height:12px;width:12px;border-radius:3px;display:inline-block}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:#a7b4c3;font-size:11px;font-weight:750;padding:8px 0 11px}.day{position:relative;isolation:isolate;overflow:hidden;min-width:0;height:clamp(58px,10vw,85px);border:1px solid #445163;border-radius:8px;background:#27313e;color:#f7f8fa;text-align:left;padding:7px 5px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}.day::before{content:"";position:absolute;inset:0;z-index:-1}.day.D::before{background:linear-gradient(140deg,#d7b65e,#a78536)}.day.O::before{background:linear-gradient(140deg,#327f5b,#1d563f)}.day.N::before{background:linear-gradient(140deg,#345c7a,#2b455e)}.day.S::before{background:linear-gradient(90deg,#f0f4f8 0%,#a8c7df 18%,#416c8d 56%,#27313e 100%)}.day.F::before{background:linear-gradient(90deg,#27313e 0%,#416c8d 44%,#a8c7df 82%,#f0f4f8 100%)}.day .num{font-size:14px;font-weight:700;text-shadow:0 1px 3px #0006}.day .mini{font-size:9px;line-height:1.25;color:#f0f4f9;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow-wrap:anywhere}.day.today{outline:2px solid #dfb2c0;outline-offset:-3px}.day.selected{border-color:#f5d9e2;box-shadow:inset 0 0 0 1px #f5d9e2}.day.blank{background:transparent;border:0;pointer-events:none}.note-indicator{position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff}.helper{font-size:12px;color:#a7b4c3;margin:14px 0 0;line-height:1.5}.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.compare button{border:1px solid #3a4759;background:#263140;color:#f1f3f6;border-radius:10px;padding:12px 4px;font-size:11px;min-width:0}.compare strong{display:block;font-size:17px;margin-bottom:7px}.compare .state{display:block;color:#bac6d4;line-height:1.4}.selecteddate{font-size:13px;color:#b4c1d0;margin:0 0 13px}.footer{color:#8999aa;text-align:center;font-size:11px;line-height:1.6;padding:12px 16px 30px}dialog{background:#202b39;color:#fff;border:1px solid #536175;border-radius:16px;padding:20px;width:min(430px,calc(100% - 26px));box-shadow:0 20px 80px #000b}dialog::backdrop{background:#050911b8}dialog h3{margin:0 0 6px}dialog p{color:#b3c1d1;font-size:13px}textarea{width:100%;min-height:130px;resize:vertical;background:#131b25;color:#fff;border:1px solid #4b5b6d;border-radius:9px;padding:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.actions button{border:1px solid #546276;border-radius:9px;padding:11px 16px;background:#303e50;color:white}.actions .save{background:#a65b70;border-color:#c47b8f;font-weight:700}@media(max-width:480px){.panel{padding:13px}.days{gap:3px}.day{height:63px;padding:5px 3px;border-radius:6px}.day .num{font-size:13px}.day .mini{font-size:8px}.legend{gap:8px 11px}.compare{gap:5px}.compare button{padding:10px 2px}}
</style></head><body><header><div class="inner"><div class="eyebrow">JNJ / WORKFORCE PLANNER</div><div class="heading"><div><h1>Shift Calendar</h1><p class="subtitle">Four patterns. One clear view.</p></div><div class="mark">A · B · C · D</div></div></div></header><main><section class="panel"><div class="label">Select shift pattern</div><div class="tabs" id="tabs"></div></section><section class="panel"><div class="monthbar"><button class="nav" id="prev" aria-label="Previous month">‹</button><h2 id="heading"></h2><button class="nav" id="next" aria-label="Next month">›</button></div><button class="todaybtn" id="todaybtn">Jump to today</button><div class="legend"><span><i class="swatch" style="background:#d7b65e"></i>Days</span><span><i class="swatch" style="background:#5681a2"></i>Nights</span><span><i class="swatch" style="background:#327f5b"></i>Off</span><span><i class="swatch" style="background:linear-gradient(90deg,#f0f4f8,#a8c7df 25%,#5681a2 65%,#27313e)"></i>Start night</span><span><i class="swatch" style="background:linear-gradient(90deg,#27313e,#5681a2 35%,#a8c7df 75%,#f0f4f8)"></i>Finish night</span></div><div class="days" id="calendar"></div><p class="helper">Tap any date to add or edit a note. Notes stay in this browser on this device.</p></section><section class="panel"><div class="label">All patterns · selected date</div><p class="selecteddate" id="selectedLabel"></p><div class="compare" id="compare"></div></section></main><footer class="footer"><span style="display:block;color:#c4a36c;font-weight:600;letter-spacing:.09em;font-size:12px;margin-bottom:5px">Designed by Bart P</span></footer><dialog id="editor"><h3 id="editHeading"></h3><p id="editStatus"></p><textarea id="noteInput" maxlength="500" placeholder="Holiday, overtime, training, reminder..."></textarea><div class="actions"><button id="cancel">Cancel</button><button id="save" class="save">Save note</button></div></dialog>
<script>
/* Shift data adapted from phryniszak/viscalendar, copyright (c) 2020 phryniszak. MIT licence: https://github.com/phryniszak/viscalendar/blob/master/LICENSE */
const SHIFT_PATTERN={"A":"ODDOODDDOODDOOODDOODDDOODDOOSNFOSNNFOSNFOOSNFOSNNFOSNFOO","B":"SNFOSNNFOSNFOOSNFOSNNFOSNFOOODDOODDDOODDOOODDOODDDOODDOO","C":"FOODDOOODDOODDDOODDOOODDOODDDOSDFOOSDFOSDDFOSDFOOSDFOSDD","D":"DOSNFOOSNFOSNNFOSNFOOSNFOSNNFOODDOOODDOODDDOODDOOODDOODD"};
const ANCHOR=Date.UTC(2005,9,10),DAY_MS=86400000;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function shiftStatus(t,d){const [y,m,day]=d.split('-').map(Number);const n=Math.floor((Date.UTC(y,m-1,day)-ANCHOR)/DAY_MS);if(n<0)return '?';return SHIFT_PATTERN[t][((n%56)+56)%56]}
const names={D:'Day shift',O:'Day off',N:'Night shift',S:'Start night',F:'Finish night','?':'Unknown'};
let team='D',view=new Date(),selected='',editing='',editingTeam='D';
try{const saved=localStorage.getItem('jnj_team');if('ABCD'.includes(saved)&&saved)team=saved}catch(e){}
function todayISO(){const d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate())}
selected=todayISO();
function noteKey(t,d){return `jnj_note_${t}_${d}`}
function getNote(t,d){try{return localStorage.getItem(noteKey(t,d))||''}catch(e){return ''}}
function render(){const tabs=$('tabs');tabs.replaceChildren();for(const t of 'ABCD'){const b=document.createElement('button');b.className='tab'+(team===t?' active':'');b.textContent=t+' Shift';b.setAttribute('aria-pressed',String(team===t));b.onclick=()=>{team=t;try{localStorage.setItem('jnj_team',t)}catch(e){}render()};tabs.append(b)}
$('heading').textContent=view.toLocaleDateString('en-IE',{month:'long',year:'numeric'});const cal=$('calendar');cal.replaceChildren();for(const wd of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']){const w=document.createElement('div');w.className='dow';w.textContent=wd;cal.append(w)}const y=view.getFullYear(),m=view.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const b=document.createElement('div');b.className='day blank';cal.append(b)}for(let d=1;d<=count;d++){const key=iso(y,m,d),s=shiftStatus(team,key),b=document.createElement('button');b.className='day '+s+(key===todayISO()?' today':'')+(key===selected?' selected':'');b.setAttribute('aria-label',`${key}, ${team} shift, ${names[s]}`);const num=document.createElement('span');num.className='num';num.textContent=d;b.append(num);const n=getNote(team,key);if(n){const dot=document.createElement('span');dot.className='note-indicator';b.append(dot);const mini=document.createElement('span');mini.className='mini';mini.textContent=n;b.append(mini)}b.onclick=()=>{selected=key;editing=key;editingTeam=team;$('editHeading').textContent=`${team} Shift · ${new Date(Date.UTC(y,m,d)).toLocaleDateString('en-IE',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}`;$('editStatus').textContent=names[s];$('noteInput').value=getNote(team,key);renderCompare();$('editor').showModal()};cal.append(b)}renderCompare()}
function renderCompare(){$('selectedLabel').textContent=new Date(selected+'T12:00:00Z').toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});const c=$('compare');c.replaceChildren();for(const t of 'ABCD'){const s=shiftStatus(t,selected),b=document.createElement('button');const strong=document.createElement('strong');strong.textContent=t;const label=document.createElement('span');label.className='state';label.textContent=names[s];b.append(strong,label);b.onclick=()=>{team=t;try{localStorage.setItem('jnj_team',t)}catch(e){}render()};c.append(b)}}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('todaybtn').onclick=()=>{view=new Date();selected=todayISO();render()};$('cancel').onclick=()=>$('editor').close();$('save').onclick=()=>{try{localStorage.setItem(noteKey(editingTeam,editing),$('noteInput').value.trim())}catch(e){alert('Could not save your note in this browser.')} $('editor').close();render()};render();
</script></body></html>
